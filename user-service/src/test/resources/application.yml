spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

jwt:
  secret: ${JWT_SECRET:dev-only-fallback-replace-me-0000000000000000000000000000}
  expiration: 86400000

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health