apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned because every panel in shopflow-overview.json addresses the
    # datasource as {"type": "prometheus", "uid": "prometheus"}. Without it
    # Grafana generates a random uid on first provision, nothing matches the
    # hardcoded reference, and the panels render "datasource not found".
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false