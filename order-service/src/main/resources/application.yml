server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5434/orders_db
    username: shopflow
    password: shopflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connect-timeout: 2000
            read-timeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publishes the _bucket series histogram_quantile() needs; without it
      # the timer only exposes _count/_sum/_max and every percentile query
      # comes back empty.
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    instances:
      userClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Must be set explicitly: the default is 100, and the Spring binder
        # sets slidingWindowSize and minimumNumberOfCalls independently
        # without the min() clamp that CircuitBreakerConfig.slidingWindow()
        # applies. Left unset, a 10-call window can never reach 100 buffered
        # calls, so the failure rate stays -1 and the breaker never opens.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      userClient:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
  # No timelimiter instance here on purpose: @TimeLimiter only wraps methods
  # returning CompletableFuture, and UserClient.userExists returns boolean.
  # The call is bounded by the Feign timeouts above instead.

logging:
  level:
    org.springframework.boot.context.config: WARN
    org.springframework.cloud: WARN
    org.apache.kafka.clients: ERROR
    com.netflix: WARN
# Transactional outbox: how often staged events are relayed to Kafka
outbox:
  publish-interval-ms: 2000
  initial-delay-ms: 5000
